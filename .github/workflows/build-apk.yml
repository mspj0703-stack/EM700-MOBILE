name: Build EM700 Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu images already provide an Android SDK.
      # Avoid android-actions/setup-android@v3, which failed during SDK update.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is missing from GitHub runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo 'Cannot locate sdkmanager.' >&2
            exit 1
          fi
          echo "Using Android SDK: $ANDROID_HOME"
          if [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" && \
                -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            echo 'Android 35 platform and build-tools 35.0.0 are already installed.'
          else
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current yt-dlp into app
        shell: bash
        run: python3 tools/bundle_ytdlp.py

      # Compile QuickJS for Android arm64, so yt-dlp can solve YouTube JS challenges.
      # The executable is packaged in nativeLibraryDir as libqjs.so (PIE ELF).
      - name: Build Android QuickJS runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if [[ -z "$NDK_DIR" ]]; then
            echo 'Android NDK is not installed on the runner.' >&2
            exit 1
          fi
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/em700-quickjs
          cmake -S /tmp/em700-quickjs -B /tmp/em700-qjs-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DQJS_ENABLE_INSTALL=OFF
          cmake --build /tmp/em700-qjs-build --target qjs_exe --parallel 4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/em700-qjs-build/qjs app/src/main/jniLibs/arm64-v8a/libqjs.so
          file app/src/main/jniLibs/arm64-v8a/libqjs.so

      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EM700-Mobile-v0.1.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
