name: Build EM700 Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu images already provide an Android SDK.
      # Avoid android-actions/setup-android@v3, which failed during SDK update.
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is missing from GitHub runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo 'Cannot locate sdkmanager.' >&2
            exit 1
          fi
          echo "Using Android SDK: $ANDROID_HOME"
          if [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" && \
                -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            echo 'Android 35 platform and build-tools 35.0.0 are already installed.'
          else
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current yt-dlp into app
        shell: bash
        run: python3 tools/bundle_ytdlp.py

      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EM700-Mobile-v0.1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
